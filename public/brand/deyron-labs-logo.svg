      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Fundal -->
  <circle cx="400" cy="400" r="400" fill="#1a1a1a"/>
  <circle cx="400" cy="330" r="180" fill="#22c55e" opacity="0.10" filter="url(#ambient)"/>

  <!-- ===== SIMBOL: cub izometric cu capac ridicat ===== -->
